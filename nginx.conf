server {
    # IPv4 only, deliberately. Replacing the stock default.conf makes the
    # nginx entrypoint skip the `listen [::]:80` line it would otherwise add,
    # and adding one unconditionally breaks startup on hosts without IPv6.
    # scripts/zenith-smoke.sh probes 127.0.0.1 for the same reason.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the header rules previously declared in _headers (a
    # Cloudflare Pages convention nginx does not read natively).
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /.well-known/matrix/ {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
